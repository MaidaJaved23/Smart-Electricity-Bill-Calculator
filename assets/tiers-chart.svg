<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-label="Electricity bill by units consumed"><rect width="1600" height="720" rx="28" fill="#0a1020"/><text x="80" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#f2f5fb">Bill grows faster in each tier</text><rect x="140" y="150" width="453" height="470" fill="#3ec5ff" opacity=".1"/><text x="367" y="180" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#3ec5ff">Rs. 10/unit</text><rect x="593" y="150" width="453" height="470" fill="#ffd23f" opacity=".1"/><text x="820" y="180" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffd23f">Rs. 15/unit</text><rect x="1047" y="150" width="453" height="470" fill="#ff6bd6" opacity=".1"/><text x="1273" y="180" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#ff6bd6">Rs. 20/unit</text><path d="M140 620H1500" stroke="#3ec5ff" opacity=".2"/><text x="120" y="626" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">0</text><path d="M140 518H1500" stroke="#3ec5ff" opacity=".2"/><text x="120" y="524" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">1000</text><path d="M140 416H1500" stroke="#3ec5ff" opacity=".2"/><text x="120" y="422" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">2000</text><path d="M140 313H1500" stroke="#3ec5ff" opacity=".2"/><text x="120" y="319" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">3000</text><path d="M140 211H1500" stroke="#3ec5ff" opacity=".2"/><text x="120" y="217" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">4000</text><text x="140" y="655" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">0</text><text x="593" y="655" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">100</text><text x="1047" y="655" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">200</text><text x="1500" y="655" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">300</text><text x="820" y="700" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0d6">Units consumed</text><polyline points="140,620 593,518 1047,364 1500,160" fill="none" stroke="#4dffb0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.5s" fill="freeze"/></polyline><circle cx="503" cy="538" r="11" fill="#0a1020" stroke="#fff" stroke-width="4"><animate attributeName="r" values="11;15;11" dur="2s" repeatCount="indefinite"/></circle><text x="487" y="514" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f5fb">80 units = Rs. 800</text><circle cx="820" cy="441" r="11" fill="#0a1020" stroke="#fff" stroke-width="4"><animate attributeName="r" values="11;15;11" dur="2s" repeatCount="indefinite"/></circle><text x="804" y="417" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f5fb">150 units = Rs. 1,750</text><circle cx="1273" cy="262" r="11" fill="#0a1020" stroke="#fff" stroke-width="4"><animate attributeName="r" values="11;15;11" dur="2s" repeatCount="indefinite"/></circle><text x="1257" y="238" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f5fb">250 units = Rs. 3,500</text></svg>