<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Program flowchart"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4dffb0"/></marker></defs><rect width="1600" height="1000" rx="28" fill="#0a1020"/><text x="80" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#f2f5fb">Program flow</text><rect x="80" y="150" width="200" height="80" rx="40" fill="#131d3a" stroke="#3ec5ff" stroke-width="3"/><text x="180.0" y="198.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">Start</text><path d="M280 190H360" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><rect x="360" y="150" width="300" height="80" rx="14" fill="#131d3a" stroke="#3ec5ff" stroke-width="3"/><text x="510.0" y="186.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">Ask household count</text><text x="510.0" y="210.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">while True + try/except</text><path d="M660 190H730" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><polygon points="850,125.0 970.0,190 850,255.0 730.0,190" fill="#131d3a" stroke="#ffd23f" stroke-width="3"/><text x="850" y="197" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f5fb">int &gt; 0 ?</text><path d="M970 190H1090" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="1015" y="175" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">yes</text><path d="M850 125V105H510V150" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="620" y="98" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">no: ask again</text><rect x="1090" y="150" width="280" height="80" rx="14" fill="#131d3a" stroke="#3ec5ff" stroke-width="3"/><text x="1230.0" y="186.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">break</text><text x="1230.0" y="210.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">leave validation loop</text><path d="M1230 230V270H220V340" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><rect x="80" y="340" width="280" height="80" rx="14" fill="#131d3a" stroke="#3ec5ff" stroke-width="3"/><text x="220.0" y="376.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">for household</text><text x="220.0" y="400.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">in range(1, n+1)</text><path d="M360 380H440" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><rect x="440" y="340" width="260" height="80" rx="14" fill="#131d3a" stroke="#3ec5ff" stroke-width="3"/><text x="570.0" y="376.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">Enter units</text><text x="570.0" y="400.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">int(input())</text><path d="M700 380H770" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><polygon points="900,315.0 1030.0,380 900,445.0 770.0,380" fill="#131d3a" stroke="#ffd23f" stroke-width="3"/><text x="900" y="387" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f5fb">int ≥ 0 ?</text><path d="M1030 380H1100" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="1050" y="365" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">no</text><rect x="1100" y="340" width="300" height="80" rx="14" fill="#131d3a" stroke="#ff6bd6" stroke-width="3"/><text x="1250.0" y="376.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">continue</text><text x="1250.0" y="400.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">skip this household</text><path d="M1250 340V305H300V340" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><path d="M900 445V500" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="915" y="478" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">yes</text><rect x="750" y="500" width="300" height="80" rx="14" fill="#131d3a" stroke="#3ec5ff" stroke-width="3"/><text x="900.0" y="536.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">Tier bill</text><text x="900.0" y="560.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">if / elif / else</text><path d="M900 580V630" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><rect x="750" y="630" width="300" height="80" rx="14" fill="#131d3a" stroke="#4dffb0" stroke-width="3"/><text x="900.0" y="666.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">Update accumulators</text><text x="900.0" y="690.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">revenue, count, highest</text><path d="M750 670H220V420" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="300" y="655" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">next household</text><path d="M1050 670H1200" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="1070" y="655" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">last household</text><polygon points="1200,675.0 1340.0,740 1200,805.0 1060.0,740" fill="#131d3a" stroke="#ffd23f" stroke-width="3"/><text x="1200" y="747" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f5fb">count &gt; 0 ?</text><path d="M1200 805V860" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="1215" y="835" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">yes</text><rect x="1050" y="860" width="300" height="70" rx="14" fill="#131d3a" stroke="#4dffb0" stroke-width="3"/><text x="1200.0" y="903.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">average = total / count</text><path d="M1050 895H900" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><path d="M1340 740H1370" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="1345" y="725" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffd23f">no</text><rect x="1370" y="700" width="200" height="80" rx="14" fill="#131d3a" stroke="#ff6bd6" stroke-width="3"/><text x="1470.0" y="736.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">No valid bills</text><text x="1470.0" y="760.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#9fb0d6">message</text><path d="M1470 780V960H750V930" fill="none" stroke="#4dffb0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><rect x="600" y="860" width="300" height="70" rx="14" fill="#131d3a" stroke="#ffd23f" stroke-width="3"/><text x="750.0" y="903.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f5fb">Monthly report</text></svg>