<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" role="img" aria-label="Entity relationship diagram"><rect width="1600" height="860" rx="28" fill="#0a1020"/><text x="80" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#f2f5fb">Data model (ER diagram)</text><rect x="80" y="180" width="340" height="172" rx="16" fill="#131d3a" stroke="#3ec5ff" stroke-width="3"/><rect x="80" y="180" width="340" height="52" rx="16" fill="#3ec5ff"/><rect x="80" y="210" width="340" height="22" fill="#3ec5ff"/><text x="250" y="215" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0a1020">HOUSEHOLD</text><text x="102" y="268" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e6ecfa">PK household_no</text><text x="102" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e6ecfa">units_input (text)</text><text x="102" y="336" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e6ecfa">is_valid (int ≥ 0)</text><rect x="630" y="180" width="340" height="206" rx="16" fill="#131d3a" stroke="#ffd23f" stroke-width="3"/><rect x="630" y="180" width="340" height="52" rx="16" fill="#ffd23f"/><rect x="630" y="210" width="340" height="22" fill="#ffd23f"/><text x="800" y="215" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0a1020">BILL</text><text x="652" y="268" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e6ecfa">PK bill_id</text><text x="652" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e6ecfa">FK household_no</text><text x="652" y="336" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e6ecfa">units (int)</text><text x="652" y="370" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e6ecfa">amount (Rs.)</text><rect x="1180