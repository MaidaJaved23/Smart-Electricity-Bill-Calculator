<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Smart Electricity Bill Calculator header">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#16204a"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#3ec5ff"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="c"><rect width="1600" height="420" rx="28"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1600" height="420" fill="url(#bg)"/>
<g stroke="#3ec5ff" opacity=".15"><path d="M0 70H1600M0 140H1600M0 210H1600M0 280H1600M0 350H1600"/></g>
<g fill="none" stroke="#ffd23f" stroke-width="4" filter="url(#gl)" stroke-dasharray="40 20"><path d="M0 390H300L340 330L420 400L470 360H1600"><animate attributeName="stroke-dashoffset" from="120" to="0" dur="2s" repeatCount="indefinite"/></path></g>
<g transform="translate(1250 90)" filter="url(#gl)"><path d="M70 0L10 110H70L40 220L140 90H80L120 0Z" fill="#ffd23f"><animate attributeName="opacity" values="1;.35;1;.8;1" dur="2.4s" repeatCount="indefinite"/></path></g>
<g fill="#3ec5ff" opacity=".8"><circle cx="1130" cy="120" r="10"><animate attributeName="cy" values="120;300;120" dur="6s" repeatCount="indefinite"/></circle><circle cx="1500" cy="250" r="8" fill="#4dffb0"><animate attributeName="cy" values="250;90;250" dur="5s" repeatCount="indefinite"/></circle><circle cx="1060" cy="330" r="6" fill="#ff6bd6"><animate attributeName="cy" values="330;110;330" dur="7s" repeatCount="indefinite"/></circle></g>
<text x="90" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#4dffb0">Python Loops  ·  while  ·  for  ·  range</text>
<text x="90" y="240" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#tt)">Smart Electricity</text>
<text x="90" y="318" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#tt)">Bill Calculator</text>
<text x="90" y="370" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#c9d3ea">Tiered billing, validated input, and a revenue report</text>
